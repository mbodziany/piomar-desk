name: Flutter Nightly Build

on:
  workflow_dispatch:

# The reusable flutter-build.yml jobs need contents: write to publish the
# nightly release artifacts. A called workflow cannot request more than its
# caller grants, so grant it here.
permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
